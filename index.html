<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resin Pop</title>

<style>
:root{--c1:#ff8fc7;--c2:#c9b6ff;--c3:#a8f0d8;--bg:#fff8fb;--ink:#2b1b3d;--r:22px;--f:'Fredoka',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Nunito',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo,button,.tab{font-family:var(--f)}h1{font-size:clamp(2.2rem,7vw,4.2rem);line-height:1.05;margin:.2em 0}
.ann{background:var(--ink);color:var(--bg);text-align:center;padding:6px 12px;font-size:.9rem}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 5vw;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:3px solid var(--ink)}
.logo{font-size:1.6rem;font-weight:600;margin-right:auto;cursor:pointer}
button,.btn{font-weight:600;font-size:1rem;border:3px solid var(--ink);background:var(--c3);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
button:hover{transform:translate(-1px,-1px) rotate(-1.5deg);box-shadow:5px 5px 0 var(--ink)}button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px dashed var(--c1);outline-offset:3px}
.pk{background:var(--c1)}.lv{background:var(--c2)}.gh{background:#fff}.sm{padding:4px 12px;font-size:.85rem}
main{padding:0 5vw 50px;max-width:1200px;margin:auto}
.hero{position:relative;padding:50px 0 30px;text-align:center}.hero p{max-width:520px;margin:8px auto 20px;font-size:1.15rem}
.blob{position:absolute;border-radius:60% 40% 55% 45%;border:3px solid var(--ink);opacity:.9;z-index:-1;animation:fl 7s ease-in-out infinite}
.b1{width:120px;height:120px;background:var(--c2);left:4%;top:30px}.b2{width:80px;height:80px;background:var(--c3);right:8%;top:10px;animation-delay:-2s}.b3{width:60px;height:60px;background:var(--c1);right:20%;bottom:0;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-18px) rotate(12deg) scale(1.06)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px;padding:20px 0}
.card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);overflow:hidden;animation:pin .5s backwards;transition:transform .2s}
.card:nth-child(odd){transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(1deg)}.card:hover{transform:rotate(0) translateY(-4px)}
@keyframes pin{from{opacity:0;transform:scale(.8) rotate(6deg)}}
.pic{height:170px;display:grid;place-items:center;font-size:4.5rem;border-bottom:3px solid var(--ink);position:relative}.pic img{width:100%;height:100%;object-fit:cover}
.card:nth-child(3n+1) .pic{background:var(--c1)}.card:nth-child(3n+2) .pic{background:var(--c2)}.card:nth-child(3n) .pic{background:var(--c3)}
.tag{position:absolute;top:8px;left:8px;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 10px;font-size:.78rem;transform:rotate(-6deg)}
.cb{padding:14px}.cb h3{margin:0}.cb p{margin:4px 0 10px;font-size:.92rem}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font:600 1.3rem var(--f)}
.box{background:var(--c2);border:3px dashed var(--ink);border-radius:var(--r);padding:20px;text-align:center;margin:20px 0}
.shake{animation:sh .5s}@keyframes sh{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.cf{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:99;font-style:normal;font-size:16px;line-height:10px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--bg);border-left:3px solid var(--ink);padding:18px;overflow:auto;z-index:20;transform:translateX(105%);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.drawer.open{transform:none}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;margin:3px 0 10px}input[type=color]{padding:2px;height:42px}input[type=checkbox]{width:auto}
label{font-weight:700;font-size:.9rem}.panel{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:6px 6px 0 var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.on{background:var(--c1)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dotted var(--ink);flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:50;animation:pin .4s;max-width:90vw;text-align:center}
footer{text-align:center;padding:30px;border-top:3px solid var(--ink);font-family:var(--f)}
a{color:inherit}.btn{text-decoration:none;display:inline-block}.pill{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:0 12px;font-size:.82rem;margin:2px 4px 2px 0;background:#fff}.pill.on{background:var(--c3);font-weight:700}
details{border-bottom:2px dotted var(--ink);padding:10px 0}summary{cursor:pointer;font:600 1.05rem var(--f)}details p{margin:8px 0 0}hr{border:0;border-top:2px dotted var(--ink);margin:16px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style id="custom"></style></head>

<script>

const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage is full. Please use smaller images.')}}};
const DS={name:'Resin Pop',logo:'🫧',tag:'Handcrafted resin art and gifts',h1:'Handcrafted resin art for everyday living',sub:'Each piece is poured, finished and cured by hand in small batches. No two are exactly alike.',ann:'A complimentary surprise gift may be included with your order',foot:'Handmade with care. All rights reserved.',cur:'₹',pay:'Payment on delivery (cash or UPI). We will contact you to confirm your order.',codes:'SPARKLE10=10\nPOPPY15=15\nGLOW5=5',c1:'#ff8fc7',c2:'#c9b6ff',c3:'#a8f0d8',bg:'#fff8fb',ink:'#2b1b3d',font:"'Fredoka'",r:22,motion:true,about:'We design and handcraft resin coasters, keychains, trays and gifts. Every item is made individually, so slight variations are part of its character.',story:'We are a small studio that designs and handcrafts resin art, including coasters, keychains, trays and gifts.\n\nEvery piece is poured, finished and cured by hand in small batches. Because each item is made individually, small variations in colour and pattern are part of its character.\n\nWe use quality resin and pigments, and we check every order before it ships.',values:'Handmade|Each item is poured and finished by hand, never mass produced.\nSmall batches|Limited runs keep quality high and designs unique.\nCustom orders|Contact us for personalised gifts and bulk orders.',email:'hello@example.com',phone:'+91 00000 00000',wa:'',insta:'',addr:'Delhi, India',hours:'Monday to Saturday, 10:00 am to 6:00 pm',faq:'How long does delivery take?|Orders are usually dispatched within 3 to 5 working days. Delivery time depends on your location.\nCan I order a custom design?|Yes. Please contact us with your idea, colours and deadline.\nHow should I care for resin products?|Wipe with a soft damp cloth. Avoid direct sunlight for long periods and very hot surfaces.\nWhich payment methods do you accept?|We currently accept cash or UPI on delivery.',ship:'Shipping: Orders are dispatched within 3 to 5 working days.\nReturns: If your item arrives damaged, contact us within 48 hours with photos and we will arrange a replacement.\nCustom orders cannot be returned.',css:''};
const DP=[[1,'Ocean Wave Coaster','🌊',349,'Blue swirl design with a pearl-finish edge.','Bestseller'],[2,'Pressed Flower Keychain','🌸',199,'Real dried flowers preserved in clear resin.','New'],[3,'Glitter Moon Tray','🌙',599,'Glitter-finish tray for rings and small items.',''],[4,'Galaxy Bookmark','🪐',149,'Deep purple galaxy design with gold accents.','Limited'],[5,'Cloud Trinket Dish','☁️',299,'Cloud-pattern dish for rings and jewellery.',''],[6,'Heart Fridge Magnet','💖',129,'Pink and gold heart design with a strong magnet.','Gift pick']].map(a=>({id:a[0],name:a[1],emoji:a[2],price:a[3],desc:a[4],badge:a[5],show:true,img:''}));
let S=LS.g('rp_site',null),P=LS.g('rp_prod',null),U=LS.g('rp_users',[{id:1,name:'Admin',email:'admin@shop.com',pass:'admin123',role:'admin'}]),O=LS.g('rp_orders',[]),cart=LS.g('rp_cart',[]),me=LS.g('rp_me',null),disc=LS.g('rp_disc',0),view='shop',tab='products',cartOpen=false,mode='in',ed=null,pimg='',gift=false;
const fmt=n=>S.cur+Math.round(n);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function pop(e,n=22){if(!S.motion||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const x=e&&e.clientX||innerWidth/2,y=e&&e.clientY||innerHeight/3,cl=[S.c1,S.c2,S.c3,'#ffe66d'];for(let i=0;i<n;i++){const s=document.createElement('i');s.className='cf';if(i%5==0)s.textContent=['✨','💖','🫧'][i%3];else s.style.background=cl[i%4];s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);const a=Math.random()*6.28,d=60+Math.random()*130;s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+90}px) rotate(${Math.random()*540}deg) scale(.4)`,opacity:0}],{duration:900+Math.random()*600,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove()}}
function theme(){const r=document.documentElement.style;['c1','c2','c3','bg','ink'].forEach(k=>r.setProperty('--'+k,S[k]));r.setProperty('--r',S.r+'px');r.setProperty('--f',S.font+',system-ui,sans-serif');document.title=S.name;$('#custom').textContent=S.css||''}
function go(v){view=v;cartOpen=false;render();scrollTo(0,0)}
function render(){theme();if(view=='admin'&&(!me||me.role!='admin'))view='auth';if((view=='account'||view=='orders')&&!me)view='auth';$('#app').innerHTML=(S.ann?`<div class="ann">${esc(S.ann)}</div>`:'')+nav()+'<main>'+({shop,auth,account,orders,admin,about,contact,faq}[view])()+'</main>'+ft()+cartHtml();}
function nav(){const n=cart.reduce((a,c)=>a+c.q,0);return `<nav><span class="logo" onclick="go('shop')">${esc(S.logo)} ${esc(S.name)}</span><button class="gh sm" onclick="go('shop')">Shop</button><button class="gh sm" onclick="go('about')">About</button><button class="gh sm" onclick="go('contact')">Contact</button><button class="gh sm" onclick="go('faq')">FAQ</button>${me?(me.role=='admin'?`<button class="lv sm" onclick="go('admin')">Admin</button>`:'')+`<button class="gh sm" onclick="go('orders')">My orders</button><button class="gh sm" onclick="go('account')">My account</button><button class="gh sm" onclick="logout()">Log out</button>`:`<button class="lv sm" onclick="mode='in';go('auth')">Log in</button>`}<button class="pk sm" onclick="cartOpen=true;render()">Cart (${n})</button></nav>`}
function shop(){return `<section class="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><h1>${esc(S.h1)}</h1><p>${esc(S.sub)}</p><button class="pk" onclick="surprise(event)" id="sb">🎁 Reveal your offer</button></section><div class="grid">${P.filter(p=>p.show).map((p,i)=>`<article class="card" style="animation-delay:${i*70}ms"><div class="pic">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}">`:esc(p.emoji)}${p.badge?`<span class="tag">${esc(p.badge)}</span>`:''}</div><div class="cb"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="row"><span class="price">${fmt(p.price)}</span><button onclick="add(${p.id},event)">Add to cart</button></div></div></article>`).join('')||'<p>No products available at the moment.</p>'}</div>${S.about?`<div class="box"><h2>About ${esc(S.name)}</h2><p>${esc(S.about)}</p><button class="lv" onclick="go('about')">Read our story</button></div>`:''}`}
function surprise(e){const b=$('#sb');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');const L=S.codes.split('\n').filter(x=>x.includes('='));pop(e,40);if(!L.length)return toast('Thank you for visiting.');const [c,p]=L[Math.floor(Math.random()*L.length)].split('=');toast(`You have unlocked ${p.trim()}% off. Use code ${c.trim()} at checkout.`)}
function add(id,e){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});sv();pop(e);if(Math.random()<.25){gift=true;toast('A complimentary gift has been added to your order.')}else toast('Added to cart.');render()}
function qty(id,d){const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);sv();render()}
function sub(){return cart.reduce((a,c)=>{const p=P.find(x=>x.id==c.id);return a+(p?p.price*c.q:0)},0)}
function cartHtml(){const t=sub(),d=t*disc/100;return `<aside class="drawer ${cartOpen?'open':''}"><div class="row"><h2>Your cart</h2><button class="gh sm" onclick="cartOpen=false;render()">Close</button></div>${cart.map(c=>{const p=P.find(x=>x.id==c.id);return p?`<div class="item"><span>${esc(p.emoji)} ${esc(p.name)}</span><span><button class="sm" onclick="qty(${p.id},-1)">-</button> ${c.q} <button class="sm" onclick="qty(${p.id},1)">+</button> ${fmt(p.price*c.q)}</span></div>`:''}).join('')||'<p>Your cart is empty.</p>'}${cart.length?`<label>Discount code</label><div class="row"><input id="cd" placeholder="SPARKLE10"><button class="sm lv" onclick="code()">Apply</button></div><p>Subtotal ${fmt(t)}${disc?`<br>Discount (${disc}%) -${fmt(d)}`:''}</p><h3>Total ${fmt(t-d)}</h3><label>Delivery address</label><textarea id="ad" rows="3">${esc(me?me.addr:'')}</textarea><p><small>${esc(S.pay)}</small></p><button class="pk" onclick="order(event)">Place order</button>`:''}</aside>`}
function code(){const v=$('#cd').value.trim().toUpperCase(),l=S.codes.split('\n').map(x=>x.split('=')).find(x=>x[0].trim().toUpperCase()==v);disc=l?+l[1]||0:0;sv();toast(l?'Discount code applied.':'Invalid discount code.');render();cartOpen=true;render()}
function auth(){return `<div class="panel" style="max-width:420px;margin:40px auto"><h2>${mode=='in'?'Log in':'Create your account'}</h2>${mode=='up'?'<label>Name</label><input id="an">':''}<label>Email</label><input id="ae" type="email"><label>Password</label><input id="ap" type="password"><button class="pk" onclick="${mode=='in'?'login()':'signup()'}">${mode=='in'?'Log in':'Create account'}</button> <button class="gh" onclick="mode='${mode=='in'?'up':'in'}';render()">${mode=='in'?'Create an account':'Back to log in'}</button></div>`}
const FS=[['name','Shop name'],['logo','Logo emoji or letter'],['tag','Tagline'],['h1','Hero title'],['sub','Hero text'],['ann','Top announcement (empty hides it)'],['foot','Footer text'],['cur','Currency symbol'],['pay','Payment note at checkout'],['about','Short About text on home page (empty hides it)'],['story','Our story page text','t'],['values','About page highlights (Title|Text, one per line)','t'],['email','Contact email'],['phone','Contact phone'],['wa','WhatsApp number with country code'],['insta','Instagram username'],['addr','Business address'],['hours','Business hours'],['faq','FAQ (Question|Answer, one per line)','t'],['ship','Shipping and returns policy','t'],['codes','Discount codes (CODE=percent, one per line)','t'],['c1','Pink accent','c'],['c2','Lilac accent','c'],['c3','Mint accent','c'],['bg','Background','c'],['ink','Text and outlines','c'],['font','Heading font','f'],['r','Corner roundness','r'],['motion','Animations and confetti','b'],['css','Custom CSS (anything else, A to Z)','t']];
function admin(){const T=['products','orders','site','users','data'];return `<h1>Admin</h1><div class="tabs">${T.map(t=>`<button class="tab ${tab==t?'on':''}" onclick="tab='${t}';ed=null;pimg='';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`+({products:aP,orders:aO,site:aS,users:aU,data:aD}[tab])()}
function aP(){const e=P.find(x=>x.id==ed)||{};return `<div class="cols"><div class="panel"><h2>${ed?'Edit product':'New product'}</h2><label>Name</label><input id="pn" value="${esc(e.name)}"><label>Price</label><input id="pp" type="number" value="${e.price??''}"><label>Emoji (used when no photo)</label><input id="pe" value="${esc(e.emoji||'🫧')}"><label>Photo</label><input id="pf" type="file" accept="image/*" onchange="photo(this)"><label>Description</label><textarea id="pd" rows="2">${esc(e.desc)}</textarea><label>Badge (optional)</label><input id="pb" value="${esc(e.badge)}"><label><input id="ps" type="checkbox" ${e.show!==false?'checked':''}> Show in shop</label><br><button class="pk" onclick="saveP()">${ed?'Save changes':'Add product'}</button> ${ed?'<button class="gh" onclick="ed=null;render()">Cancel</button>':''}</div><div class="panel"><h2>Products (${P.length})</h2>${P.map(p=>`<div class="item"><span>${esc(p.emoji)} ${esc(p.name)} · ${fmt(p.price)}${p.show?'':' (hidden)'}</span><span><button class="sm" onclick="ed=${p.id};render()">Edit</button> <button class="sm pk" onclick="delP(${p.id})">Delete</button></span></div>`).join('')}</div></div>`}
function photo(i){
  const f=i.files&&i.files[0]; if(!f)return;
  if(!f.type.startsWith('image/')){toast('Please choose an image file.');i.value='';return}
  if(f.size>5*1024*1024){toast('Please choose an image under 5 MB.');i.value='';return}

}
function aO(){return `<div class="panel"><h2>Orders (${O.length})</h2>${O.map(o=>`<div class="item"><span>#${String(o.id).slice(-5)} · ${esc(o.who)} · ${esc(o.date)}<br><small>${o.items.map(i=>esc(i.n)+' x'+i.q).join(', ')}${o.gift?' + complimentary gift':''}<br>${esc(o.addr)}</small></span><span>${fmt(o.total)}<br><select onchange="setSt(${o.id},this.value)">${['Placed','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></span></div>`).join('')||'<p>No orders yet.</p>'}</div>`}
function aS(){return `<div class="panel"><h2>Site settings</h2><div class="cols">${FS.map(([k,l,t])=>`<div style="${t=='t'?'grid-column:1/-1':''}"><label>${l}</label>${t=='t'?`<textarea id="s_${k}" rows="4">${esc(S[k])}</textarea>`:t=='c'?`<input id="s_${k}" type="color" value="${S[k]}">`:t=='b'?`<br><input id="s_${k}" type="checkbox" ${S[k]?'checked':''}>`:t=='r'?`<input id="s_${k}" type="range" min="0" max="40" value="${S[k]}">`:t=='f'?`<select id="s_${k}">${[['Fredoka',"'Fredoka'"],['Pacifico (script)',"'Pacifico'"],['Caveat (handwritten)',"'Caveat'"],['Nunito (plain)',"'Nunito'"]].map(([n,v])=>`<option value="${v}" ${S.font==v?'selected':''}>${n}</option>`).join('')}</select>`:`<input id="s_${k}" value="${esc(S[k])}">`}</div>`).join('')}</div><button class="pk" onclick="saveS()">Save site</button> <button class="gh" onclick="resetS()">Reset design</button></div>`}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({site:S,products:P},null,1)],{type:'application/json'}));a.download='site-data.json';a.click()}

async function order(e){if(!me){toast('Please log in or create an account to place your order.');cartOpen=false;mode='in';return go('auth')}const a=$('#ad').value.trim();if(!a)return toast('Please enter a delivery address.');const t=sub(),o={uid:me.id,who:me.name,items:cart.filter(c=>P.find(x=>x.id==c.id)).map(c=>{const p=P.find(x=>x.id==c.id);return{n:p.name,q:c.q,p:p.price}}),total:t-t*disc/100,addr:a,status:'Placed',gift,date:new Date().toLocaleDateString()};try{if(cloud())await FB.set('orders',String(Date.now()),o);else O.unshift({id:Date.now(),...o})}catch(x){return fail(x)}cart=[];disc=0;gift=false;sv();pop(e,60);toast('Order placed successfully. Thank you for your purchase.');cartOpen=false;go('orders')}
async function uploadProductImage(file){
  const c=window.CLOUDINARY_CONFIG||{};
  if(!c.cloudName||/^PASTE/.test(c.cloudName)||!c.uploadPreset||/^PASTE/.test(c.uploadPreset))
    throw new Error('Cloudinary is not configured. Add your Cloud Name and unsigned Upload Preset.');
  const body=new FormData();
  body.append('file',file);
  body.append('upload_preset',c.uploadPreset);
  body.append('folder','resin-pop/products');
  const endpoint='https://api.cloudinary.com/v1_1/'+encodeURIComponent(c.cloudName)+'/image/upload';
  const res=await fetch(endpoint,{method:'POST',body});
  const data=await res.json();
  if(!res.ok||!data.secure_url) throw new Error(data.error?.message||'Cloudinary image upload failed. Check the upload preset.');
  return data.secure_url;
}
async function saveP(){
  const n=$('#pn').value.trim(),pr=+$('#pp').value;
  if(!n||!(pr>=0))return toast('Please enter a product name and price.');
  const o={name:n,price:pr,emoji:$('#pe').value||'🫧',desc:$('#pd').value,badge:$('#pb').value,show:$('#ps').checked};
  const old=P.find(x=>x.id==ed),id=ed?String(ed):String(Date.now());
  try{
    if(cloud()){
      if(pimg instanceof File) o.img=await uploadProductImage(pimg);
      else o.img=(old?old.img:'')||'';
      await FB.set('products',id,o);
    }else{
      o.img='';
      if(old)Object.assign(old,o);else P.push({id:+id,...o});
    }
  }catch(x){return fail(x)}
  ed=null;pimg='';sv();pop();toast('Product saved.');render();
}

let un=[];
const soft=()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render()};
async function loadMe(u){
  let d=await FB.getUser(u.uid);
  if(!d){
    d={name:(u.email||'User').split('@')[0],email:u.email,role:'user',phone:'',addr:''};
    await FB.setUser(u.uid,d);
  }
  const isAdmin=!!window.ADMIN_UID && u.uid===window.ADMIN_UID;
  if(d.role!==(isAdmin?'admin':'user')) await FB.setUser(u.uid,{role:isAdmin?'admin':'user'});
  return {...d,id:u.uid,role:isAdmin?'admin':'user',email:u.email||d.email||''};
}
function watch(){un.forEach(f=>f());un=[];O=[];U=[];if(!me)return;const so=a=>{O=a.sort((x,y)=>y.id-x.id);soft()};if(me.role=='admin')un.push(FB.watch('orders',so),FB.watch('users',a=>{U=a;soft()}));else un.push(FB.watch('orders',so,FB.where('uid','==',me.id)))}

if(!S||!P){try{const d=await (await fetch('site-data.json',{cache:'no-store'})).json();S=S||{...DS,...d.site};P=P||d.products}catch(e){}}S={...DS,...S};P=P||DP;render()})();

<script type="module">
const B='https://www.gstatic.com/firebasejs/10.12.2/';
try{const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey&&!/^PASTE/.test(cfg.apiKey)){
const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
const app=A.initializeApp(cfg),auth=Au.getAuth(app),db=F.getFirestore(app),storage=St.getStorage(app),col=n=>F.collection(db,n),dc=(n,i)=>F.doc(db,n,i);
window.FB={
login:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
signup:async(n,e,p)=>{const c=await Au.createUserWithEmailAndPassword(auth,e,p);await F.setDoc(dc('users',c.user.uid),{name:n,email:e,role:'user',phone:'',addr:''});return c},
logout:()=>Au.signOut(auth),
setPass:p=>Au.updatePassword(auth.currentUser,p),
authChange:cb=>Au.onAuthStateChanged(auth,cb),
getUser:async id=>{const d=await F.getDoc(dc('users',id));return d.exists()?{...d.data(),id}:null},
setUser:(id,d)=>F.setDoc(dc('users',id),d,{merge:true}),
where:F.where,
watch:(n,cb,...q)=>F.onSnapshot(q.length?F.query(col(n),...q):col(n),s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>console.error(e)),
watchDoc:(n,i,cb)=>F.onSnapshot(dc(n,i),d=>cb(d.exists()?d.data():null),e=>console.error(e)),
set:(n,i,d)=>F.setDoc(dc(n,i),d),upd:(n,i,d)=>F.updateDoc(dc(n,i),d),del:(n,i)=>F.deleteDoc(dc(n,i))}}
}catch(e){window.FB_ERR=e;console.error(e)}
window.FB_DONE=true;dispatchEvent(new Event('fbready'));
</script></body></html>
